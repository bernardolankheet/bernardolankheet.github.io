name: Deploy MkDocs
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Turnstile validator Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          wrangler deploy
          echo "${{ secrets.TURNSTILE_SECRET_KEY }}" | wrangler secret put TURNSTILE_SECRET_KEY

  mkdocs:
    needs: worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      - name: Build and deploy to GitHub Pages
        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_WORKER_URL: ${{ vars.TURNSTILE_WORKER_URL }}
        run: |
          mkdir -p docs/assets/js
          cat > docs/assets/js/turnstile-config.js <<'EOF'
window.TURNSTILE_SITE_KEY = "${TURNSTILE_SITE_KEY}";
window.TURNSTILE_WORKER_URL = "${TURNSTILE_WORKER_URL}";
EOF
          mkdocs gh-deploy --force